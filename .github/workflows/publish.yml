name: Publish

# fmtk tags a release as a bare version by default (package.tagName is
# "$VERSION"), so that is what this matches. Run `fmtk publish` locally to
# datestamp the changelog, commit as compilatron, tag and push; this workflow
# takes over from the tag and does the mod portal upload.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    # A dispatch from a branch has no tag to verify against and no ref to hang a
    # release off, so the tag-gated steps silently skipped while the portal
    # upload still ran, publishing a version with no tag and no release.
    # Requiring a tag for the whole job makes that impossible; dispatching
    # against a tag still works, which is what re-running a partial publish needs.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install fmtk
        run: npm install -g factoriomod-debug

      - name: Read mod info
        id: mod
        run: |
          {
            echo "name=$(jq -r .name info.json)"
            echo "version=$(jq -r .version info.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Verify tag matches info.json
        env:
          MOD_VERSION: ${{ steps.mod.outputs.version }}
        run: |
          if [ "$MOD_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match info.json version $MOD_VERSION"
            exit 1
          fi

      - name: Verify changelog has an entry for this version
        env:
          MOD_VERSION: ${{ steps.mod.outputs.version }}
        run: |
          # changelog.txt is CRLF in this repo, so strip CR before matching.
          if ! tr -d '\r' < changelog.txt | grep -qxF "Version: $MOD_VERSION"; then
            echo "::error::changelog.txt has no 'Version: $MOD_VERSION' entry"
            exit 1
          fi

      - name: Package
        run: fmtk package

      - name: Check whether the portal already has this version
        id: portal
        env:
          MOD_NAME: ${{ steps.mod.outputs.name }}
          MOD_VERSION: ${{ steps.mod.outputs.version }}
        run: |
          # The portal rejects a duplicate version, which would fail the run
          # before the release step and leave the tag with no GitHub release.
          # Skipping an upload that is already done makes a re-run recoverable.
          if curl -sf "https://mods.factorio.com/api/mods/${MOD_NAME}" \
              | jq -e --arg v "$MOD_VERSION" \
                  'any(.releases[]; .version == $v)' >/dev/null; then
            echo "::notice::${MOD_NAME} ${MOD_VERSION} is already on the portal, skipping upload"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to mod portal
        if: steps.portal.outputs.exists != 'true'
        env:
          FACTORIO_UPLOAD_API_KEY: ${{ secrets.FACTORIO_UPLOAD_API_KEY }}
          MOD_NAME: ${{ steps.mod.outputs.name }}
          MOD_VERSION: ${{ steps.mod.outputs.version }}
        run: fmtk upload "${MOD_NAME}_${MOD_VERSION}.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          MOD_NAME: ${{ steps.mod.outputs.name }}
          MOD_VERSION: ${{ steps.mod.outputs.version }}
        run: |
          tr -d '\r' < changelog.txt \
            | awk -v v="Version: $MOD_VERSION" \
                '$0==v{f=1;next} f&&/^-+$/{exit} f' > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            "${MOD_NAME}_${MOD_VERSION}.zip" \
            --title "$MOD_VERSION" \
            --notes-file release-notes.md
